services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: recoverai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recoverai
      POSTGRES_USER: postgres
      # Override in .env for anything beyond local demo use.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recoveraipassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recoverai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Cache & Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: recoverai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Python Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recoverai_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-recoveraipassword}@postgres:5432/recoverai
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - SEED_ON_STARTUP=true
      # Warm-start: batch-process a slice of dev payments at boot so the
      # dashboard shows real non-zero numbers on first open (demo payments
      # pay_dev_0001/0002 are reserved and never consumed).
      - DEMO_WARM_START=true
      # LLM reasoning layer (advisory only; deterministic fallback when unset)
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Generous start_period: first boot seeds 1,000 payments and warm-starts
      # the recovery pipeline before serving traffic.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # 4. Next.js 16 + Razorpay Blade Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at BUILD time; must be reachable from
        # the user's browser (compose maps the backend to localhost:8000).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: recoverai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
