version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: recoverai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recoverai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: recoveraipassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recoverai"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Cache & Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: recoverai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Python Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recoverai_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:recoveraipassword@postgres:5432/recoverai
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - SEED_ON_STARTUP=true
      # Warm-start: batch-process a slice of dev payments at boot so the
      # dashboard shows real non-zero numbers on first open (demo payments
      # pay_dev_0001/0002 are reserved and never consumed).
      - DEMO_WARM_START=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Next.js 16 Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recoverai_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
