name: Agent context refresh

# The repo keeps itself explainable to fresh coding agents: every push to main
# regenerates the machine-generated context (.agents/context/ — repo map, API
# surface, test inventory, DB schema) and commits it back if anything changed.

on:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: context-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Loop guard #1: never trigger on our own refresh commit.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Regenerate context
        env:
          SEED_ON_STARTUP: "false"
        run: python scripts/generate_context.py
      - name: Commit refreshed context (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/context
          # Loop guard #2: [skip ci] makes GitHub skip workflows for this commit.
          git diff --staged --quiet \
            || (git commit -m "chore(agents): refresh machine-generated context [skip ci]" && git push)
